<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجمات أولى / ١</title><style>body{font-family:Tahoma,Arial;background:#fff6fa;color:#46364a;margin:0;padding:16px}header,.panel{background:white;border-radius:18px;padding:16px;margin:0 auto 15px;max-width:900px;box-shadow:0 3px 15px #e9d8e6}header{text-align:center;background:#f5d8ec}h1{margin:5px}button,select,input{font:inherit;padding:10px;border-radius:10px;border:1px solid #dfc5d6}button{cursor:pointer;background:#9d5da2;color:white;border:0}button.minus{background:#e8dbe6;color:#633f64}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.kid{background:#fff9fe;border:1px solid #ead7e8;border-radius:15px;text-align:center;padding:12px}.avatar{font-size:46px}.name{font-weight:bold;min-height:38px}.score{font-size:24px;color:#8a3f92;font-weight:bold}.actions{display:flex;gap:6px;justify-content:center;margin-top:8px}.actions button{min-width:44px}.tools{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.leaders{line-height:2}.note{color:#796b7a;font-size:12px}#status{font-size:13px;color:#76517a}</style></head><body><header><h1>🌟 نجمات أولى / ١ 🌟</h1><div>مدارس التربية النموذجية – الروابي</div><p>المعلمة: مشاعل السعيدان</p></header><section class="panel"><h3>🎁 اختاري مهارة التحفيز</h3><div class="tools"><select id="skill"><option value="5">القراءة بطلاقة +٥</option><option value="5">الإملاء الصحيح +٥</option><option value="3">إنجاز الواجب +٣</option><option value="2">المشاركة +٢</option><option value="2">الهدوء +٢</option><option value="2">التعاون +٢</option><option value="1">نجمة تشجيعية +١</option></select><input id="search" placeholder="بحث عن طالبة"><button id="download">حفظ نسخة من النقاط</button><button id="reset" class="minus">تصفير النقاط</button></div><p id="status">تُحفظ النقاط تلقائيًا في هذا المتصفح.</p></section><section class="panel"><h3>👑 لوحة المتصدرات</h3><div id="leaders" class="leaders"></div></section><section class="panel"><h3>💖 طالبات الفصل</h3><div id="grid" class="grid"></div></section><section class="panel"><div class="tools"><input id="newName" placeholder="اسم طالبة جديدة"><button id="add">إضافة طالبة</button></div><p class="note">الحفظ محلي في هذا المتصفح فقط؛ احتفظي بنسخة CSV دوريًا. لا تنشري بيانات الطالبات على رابط عام دون موافقة المدرسة.</p></section><script>const initial=['أروى','الجوهرة','أنفال','بسمة','حلا','حصة','سحاب','سلطانة','سارة','شام','شهد','غالية','فرح','ملك العتيبي','ملك البقمي','ملك الغامدي','نجلاء','نورة','يارا'];let students;try{students=JSON.parse(localStorage.getItem('stars_class_1'))||initial.map((name,i)=>({id:i+1,name,points:0,history:[]}))}catch(e){students=initial.map((name,i)=>({id:i+1,name,points:0,history:[]}))}const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('stars_class_1',JSON.stringify(students))}catch(e){$('status').textContent='الحفظ التلقائي غير متاح في هذا المتصفح؛ استخدمي حفظ نسخة من النقاط.'}}function render(){let ranked=[...students].sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,'ar'));$('leaders').textContent='';ranked.slice(0,5).forEach((s,i)=>{let p=document.createElement('div');p.textContent=['🥇','🥈','🥉','⭐','⭐'][i]+' '+s.name+' — '+s.points+' نقطة';$('leaders').append(p)});$('grid').textContent='';let q=$('search').value.trim();ranked.filter(s=>s.name.includes(q)).forEach((s,i)=>{let card=document.createElement('div');card.className='kid';let a=document.createElement('div');a.className='avatar';a.textContent=['🦄','🐱','🐼','🦋','🐰','🐻','🦊','🐨'][s.id%8];let n=document.createElement('div');n.className='name';n.textContent=s.name;let score=document.createElement('div');score.className='score';score.textContent='⭐ '+s.points;let actions=document.createElement('div');actions.className='actions';let plus=document.createElement('button');plus.textContent='+ نقاط';plus.onclick=()=>{let v=Number($('skill').value);s.points+=v;s.history.push(v);save();render()};let minus=document.createElement('button');minus.className='minus';minus.textContent='↶';minus.title='التراجع عن آخر إضافة';minus.onclick=()=>{if(s.history.length){s.points-=s.history.pop();save();render()}};actions.append(plus,minus);card.append(a,n,score,actions);$('grid').append(card)})} $('search').oninput=render;$('add').onclick=()=>{let name=$('newName').value.trim();if(!name||students.some(s=>s.name===name))return;students.push({id:Math.max(0,...students.map(s=>s.id))+1,name,points:0,history:[]});$('newName').value='';save();render()};$('reset').onclick=()=>{if(confirm('هل تريدين تصفير جميع النقاط؟')){students.forEach(s=>{s.points=0;s.history=[]});save();render()}};$('download').onclick=()=>{let csv='\ufeffالطالبة,النقاط\r\n'+students.map(s=>'"'+s.name.replace(/"/g,'""')+'",'+s.points).join('\r\n');let a=document.createElement('a');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='نقاط-أولى-١.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();</script></body></html>
